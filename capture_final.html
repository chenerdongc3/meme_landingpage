<!doctype html>
<html><head><meta charset="utf-8"><title>Capture</title>
<style>html,body{margin:0;padding:0;overflow:hidden}</style>
</head><body>
<iframe id="f" src="http://127.0.0.1:8765/index.html" style="width:1440px;height:900px;border:0;display:block"></iframe>
<script>
window.onload = function() {
  setTimeout(function() {
    var iframe = document.getElementById('f');
    try {
      // Scroll the iframe content to the very bottom to trigger final scene
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      var story = doc.getElementById('scrollStory');
      if (story) {
        // Scroll to near the end of the scroll-story section
        iframe.contentWindow.scrollTo({top: story.offsetTop + story.offsetHeight - iframe.contentWindow.innerHeight - 10, behavior: 'instant'});
      } else {
        iframe.contentWindow.scrollTo(0, 999999);
      }
    } catch(e) {
      console.log('scroll error:', e);
    }
  }, 2000);
};
</script>
</body></html>
